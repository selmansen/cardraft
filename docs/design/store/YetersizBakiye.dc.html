<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;900&display=swap">
  <style>
    body { margin: 0; background: #FBF7F0; }
    a { color: #2E62C8; } a:hover { color: #1E4FB0; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 402px; height: 874px; background: #FBF7F0; font-family: Nunito, system-ui, sans-serif; color: #1E2436; position: relative; overflow: hidden;">

  <!-- Arkada mağaza, önde alt sayfa. Oyuncu nereden geldiğini görüyor. -->
  <div style="padding: 14px 16px 0 16px; opacity: 0.4;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <span style="font: 700 13px/18px Nunito, sans-serif; color: #6B7285;">Menü</span>
      <div style="display: flex; align-items: center; gap: 9px; padding: 7px 12px; background: #FFFFFF; border: 1px solid #EBE3D6; border-radius: 999px;">
        <span style="font: 800 14px/1 'Baloo 2', sans-serif;">180</span>
        <div style="width: 1px; height: 14px; background: #EBE3D6;"></div>
        <span style="font: 800 14px/1 'Baloo 2', sans-serif;">0</span>
      </div>
    </div>
    <h1 style="margin: 10px 0 0 0; font: 800 26px/32px 'Baloo 2', sans-serif;">Mağaza</h1>
    <div style="margin-top: 16px; height: 220px; background: #FFFFFF; border: 2px solid #AFB5C2; border-radius: 20px;"></div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(16,18,28,0.5);"></div>

  <!-- Alt sayfa -->
  <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 12px 16px 30px 16px; box-shadow: 0 -10px 24px rgba(30,36,54,0.16);">
    <div style="width: 44px; height: 4px; border-radius: 999px; background: #EBE3D6; margin: 0 auto 18px auto;"></div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 6px;">
      <div style="width: 58px; height: 58px; border-radius: 999px; background: #FFF0DC; display: flex; align-items: center; justify-content: center;">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#B35C00" stroke-width="2"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3.5"></circle></svg>
      </div>
      <div style="font: 800 22px/28px 'Baloo 2', sans-serif; color: #1E2436;">170 jant eksik</div>
      <div style="font: 600 13px/18px Nunito, sans-serif; color: #6B7285; text-align: center; max-width: 290px;">
        Temel Paket 350 jant. Bakiyen 180. Maç kazandıkça jant biriktirirsin — kaybetsen de bir miktar kazanırsın.
      </div>
    </div>

    <!-- İlerleme, "ne kadar kaldı"ı somutlaştırıyor -->
    <div style="margin-top: 18px; padding: 14px; background: #F3EEE4; border-radius: 16px; display: flex; flex-direction: column; gap: 9px;">
      <div style="display: flex; align-items: center; justify-content: space-between;">
        <span style="font: 700 13px/18px Nunito, sans-serif; color: #4A5266;">Temel Paket'e kalan</span>
        <span style="font: 800 14px/18px 'Baloo 2', sans-serif; color: #1E2436;">180 / 350</span>
      </div>
      <div style="height: 10px; border-radius: 999px; background: #EBE3D6; overflow: hidden;">
        <div style="width: 51%; height: 100%; border-radius: 999px; background: #3A7BF0;"></div>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#6B7285" stroke-width="2" stroke-linecap="round"><path d="M6 4l14 8-14 8z"></path></svg>
        <span style="font: 600 12px/16px Nunito, sans-serif; color: #6B7285;">Normal zorlukta ortalama 2 maç</span>
      </div>
    </div>

    <div style="margin-top: 16px; display: flex; flex-direction: column; gap: 10px;">
      <div style="background: #B35C00; border-radius: 999px;">
        <div style="height: 52px; margin-bottom: 4px; background: #FF9522; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E2436" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l14 8-14 8z"></path></svg>
          <span style="font: 900 15px/20px Nunito, sans-serif; letter-spacing: 0.2px; color: #1E2436;">Maça gir</span>
        </div>
      </div>
      <div style="background: #DCE9FF; border-radius: 999px;">
        <div style="height: 52px; margin-bottom: 4px; background: #FFFFFF; border: 2px solid #DCE9FF; border-radius: 999px; display: flex; align-items: center; justify-content: center;">
          <span style="font: 900 15px/20px Nunito, sans-serif; letter-spacing: 0.2px; color: #2E62C8;">Vazgeç</span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
